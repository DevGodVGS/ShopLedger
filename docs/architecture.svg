<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1480" viewBox="0 0 1880 1480" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order flow</title>
  <desc id="desc">Roomy architecture diagram of the ShopLedger browser UI, Express routes, library modules, configuration and JSON store, with numbered order steps and the later printable invoice path. Invoice, pricing and tax modules are highlighted for the invoice total and GST mismatch ticket.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="invoiceArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526176; }
      .section { font-size: 17px; font-weight: 700; letter-spacing: .4px; fill: #334155; }
      .node-title { font-size: 17px; font-weight: 700; }
      .node-sub { font-size: 13px; fill: #475569; }
      .small { font-size: 13px; fill: #526176; }
      .flow-copy { font-size: 13px; fill: #334155; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .focus { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
      .focus-strong { fill: #fff1f2; stroke: #e11d48; stroke-width: 3; }
      .route { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .area { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .general { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .reference { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#flowArrow); }
      .invoice-flow { fill: none; stroke: #9333ea; stroke-width: 2.5; marker-end: url(#invoiceArrow); }
      .badge { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
      .badge-invoice { fill: #9333ea; stroke: #ffffff; stroke-width: 2; }
      .badge-text { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1880" height="1480" fill="#f8fafc"/>
  <text x="48" y="53" class="title">ShopLedger · application architecture</text>
  <text x="48" y="82" class="subtitle">Existing code structure, order creation, stored ledger and printable invoice path</text>

  <!-- Architecture areas -->
  <rect x="40" y="112" width="250" height="690" rx="14" class="area"/>
  <text x="62" y="148" class="section">BROWSER UI</text>
  <rect x="62" y="180" width="206" height="112" rx="10" class="node"/>
  <text x="82" y="213" class="node-title">public/</text>
  <text x="82" y="239" class="node-sub">index.html</text>
  <text x="82" y="263" class="node-sub">js/app.js · css/style.css</text>
  <text x="62" y="326" class="small">Static files served by Express</text>
  <rect x="62" y="390" width="206" height="120" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="82" y="424" class="node-title">Order desk</text>
  <text x="82" y="451" class="node-sub">Creates order request</text>
  <text x="82" y="476" class="node-sub">POST /api/orders</text>
  <text x="62" y="546" class="small">Receives the order response</text>

  <rect x="330" y="112" width="400" height="690" rx="14" class="area"/>
  <text x="352" y="148" class="section">EXPRESS APP</text>
  <rect x="355" y="180" width="350" height="100" rx="10" class="node"/>
  <text x="375" y="214" class="node-title">server.js</text>
  <text x="375" y="242" class="node-sub">bodyParser.json · serves public/</text>
  <text x="375" y="263" class="node-sub">mounts API routes</text>
  <rect x="355" y="315" width="350" height="72" rx="10" class="route"/>
  <text x="375" y="344" class="node-title">routes/products.js</text>
  <text x="375" y="369" class="node-sub">Mounted at /api</text>
  <rect x="355" y="408" width="350" height="92" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="375" y="440" class="node-title">routes/orders.js</text>
  <text x="375" y="468" class="node-sub">Create · list · detail · cancel orders</text>
  <rect x="355" y="521" width="350" height="72" rx="10" class="route"/>
  <text x="375" y="550" class="node-title">routes/customers.js</text>
  <text x="375" y="575" class="node-sub">Mounted at /api</text>
  <rect x="355" y="614" width="350" height="72" rx="10" class="route"/>
  <text x="375" y="643" class="node-title">routes/reports.js</text>
  <text x="375" y="668" class="node-sub">Mounted at /api</text>
  <rect x="355" y="707" width="350" height="66" rx="10" class="route"/>
  <text x="375" y="736" class="node-title">GET /orders/:id/invoice</text>
  <text x="375" y="759" class="node-sub">server.js printable HTML route</text>

  <rect x="770" y="112" width="680" height="690" rx="14" class="area"/>
  <text x="792" y="148" class="section">LIB MODULES · lib/</text>
  <rect x="800" y="180" width="290" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="820" y="211" class="node-title">inventory.js</text>
  <text x="820" y="237" class="node-sub">find · check · reserve</text>
  <rect x="1120" y="180" width="300" height="78" rx="10" class="focus"/>
  <text x="1140" y="211" class="node-title">pricing.js</text>
  <text x="1140" y="237" class="node-sub">subtotal · discount · computeTotals</text>

  <rect x="800" y="280" width="290" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="820" y="311" class="node-title">coupons.js</text>
  <text x="820" y="337" class="node-sub">normalize · validate · discount</text>
  <rect x="1120" y="280" width="300" height="78" rx="10" class="focus"/>
  <text x="1140" y="311" class="node-title">tax.js</text>
  <text x="1140" y="337" class="node-sub">HSN rate · CGST / SGST split</text>

  <rect x="800" y="380" width="290" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="820" y="411" class="node-title">ledger.js</text>
  <text x="820" y="437" class="node-sub">Khata charge · customer balance</text>
  <rect x="1120" y="380" width="300" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1140" y="411" class="node-title">orders.js</text>
  <text x="1140" y="437" class="node-sub">add · get · list · cancel</text>

  <rect x="800" y="480" width="290" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="820" y="511" class="node-title">store.js</text>
  <text x="820" y="537" class="node-sub">read · appendAudit · write</text>
  <rect x="1120" y="480" width="300" height="78" rx="10" class="node"/>
  <text x="1140" y="511" class="node-title">dates.js</text>
  <text x="1140" y="537" class="node-sub">Date keys · Indian dates · fiscal year</text>

  <rect x="800" y="580" width="290" height="78" rx="10" class="node"/>
  <text x="820" y="611" class="node-title">reports.js</text>
  <text x="820" y="637" class="node-sub">Dashboard · GST reconciliation</text>
  <rect x="1120" y="580" width="300" height="78" rx="10" class="focus-strong"/>
  <text x="1140" y="611" class="node-title">invoice.js</text>
  <text x="1140" y="637" class="node-sub">computeInvoiceFigures · render</text>

  <rect x="1490" y="112" width="350" height="690" rx="14" class="area"/>
  <text x="1512" y="148" class="section">DATA &amp; CONFIG</text>
  <rect x="1520" y="205" width="290" height="112" rx="10" class="node"/>
  <text x="1540" y="240" class="node-title">config.js</text>
  <text x="1540" y="268" class="node-sub">port · shop details · tax slabs</text>
  <text x="1540" y="291" class="node-sub">inventory settings · coupons</text>
  <rect x="1520" y="440" width="290" height="124" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="1540" y="476" class="node-title">data/db.json</text>
  <text x="1540" y="504" class="node-sub">products · orders · customers</text>
  <text x="1540" y="530" class="node-sub">settlements · auditLog</text>
  <text x="1520" y="610" class="small">Read and written by lib/store.js</text>

  <!-- Boundary wiring arrows stay in the gutters between areas. -->
  <path d="M290 300 H330" class="general"/>
  <path d="M730 270 H770" class="general"/>
  <path d="M1450 270 H1490" class="general"/>
  <text x="62" y="770" class="small">Gray arrows show the main UI → routes → library → data wiring.</text>

  <!-- Numbered order sequence. Numbers sit beside the arrows between step cards. -->
  <rect x="40" y="835" width="1800" height="205" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="62" y="871" class="section">ORDER CREATION · numbered steps follow routes/orders.js</text>

  <rect x="62" y="894" width="185" height="116" rx="10" class="route"/>
  <text x="80" y="927" class="node-title">Request</text>
  <text x="80" y="954" class="flow-copy">Order desk sends</text>
  <text x="80" y="977" class="flow-copy">POST /api/orders</text>
  <path d="M247 951 H286" class="flow"/>
  <circle cx="266" cy="925" r="14" class="badge"/><text x="266" y="925" class="badge-text">1</text>

  <rect x="302" y="894" width="185" height="116" rx="10" class="node"/>
  <text x="320" y="927" class="node-title">Validate stock</text>
  <text x="320" y="954" class="flow-copy">Find products and</text>
  <text x="320" y="977" class="flow-copy">check quantities</text>
  <path d="M487 951 H526" class="flow"/>
  <circle cx="506" cy="925" r="14" class="badge"/><text x="506" y="925" class="badge-text">2</text>

  <rect x="542" y="894" width="185" height="116" rx="10" class="node"/>
  <text x="560" y="927" class="node-title">Price order</text>
  <text x="560" y="954" class="flow-copy">Validate coupon;</text>
  <text x="560" y="977" class="flow-copy">compute GST totals</text>
  <path d="M727 951 H766" class="flow"/>
  <circle cx="746" cy="925" r="14" class="badge"/><text x="746" y="925" class="badge-text">3</text>

  <rect x="782" y="894" width="185" height="116" rx="10" class="node"/>
  <text x="800" y="927" class="node-title">Khata</text>
  <text x="800" y="954" class="flow-copy">Charge the balance</text>
  <text x="800" y="977" class="flow-copy">when selected</text>
  <path d="M967 951 H1006" class="flow"/>
  <circle cx="986" cy="925" r="14" class="badge"/><text x="986" y="925" class="badge-text">4</text>

  <rect x="1022" y="894" width="185" height="116" rx="10" class="node"/>
  <text x="1040" y="927" class="node-title">Create order</text>
  <text x="1040" y="954" class="flow-copy">Reserve stock;</text>
  <text x="1040" y="977" class="flow-copy">call orders.add</text>
  <path d="M1207 951 H1246" class="flow"/>
  <circle cx="1226" cy="925" r="14" class="badge"/><text x="1226" y="925" class="badge-text">5</text>

  <rect x="1262" y="894" width="185" height="116" rx="10" class="node"/>
  <text x="1280" y="927" class="node-title">Save</text>
  <text x="1280" y="954" class="flow-copy">Append audit and</text>
  <text x="1280" y="977" class="flow-copy">write the database</text>
  <path d="M1447 951 H1486" class="flow"/>
  <circle cx="1466" cy="925" r="14" class="badge"/><text x="1466" y="925" class="badge-text">6</text>

  <rect x="1502" y="894" width="150" height="116" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="1520" y="927" class="node-title">Persist</text>
  <text x="1520" y="954" class="flow-copy">Order is in</text>
  <text x="1520" y="977" class="flow-copy">data/db.json</text>
  <path d="M1652 951 H1691" class="flow"/>
  <circle cx="1671" cy="925" r="14" class="badge"/><text x="1671" y="925" class="badge-text">7</text>

  <rect x="1707" y="894" width="111" height="116" rx="10" class="focus-strong"/>
  <text x="1721" y="927" class="node-title">Invoice</text>
  <text x="1721" y="954" class="flow-copy">Later request</text>
  <text x="1721" y="977" class="flow-copy">renders HTML</text>
  <text x="62" y="1030" class="small">Blue arrows show order creation; purple marks the later invoice request and render.</text>

  <!-- Ticket focus and invoice calculation detail -->
  <rect x="40" y="1070" width="1800" height="74" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="62" y="1101" class="node-title" fill="#9a3412">TICKET FOCUS · Invoice total / GST mismatch</text>
  <text x="62" y="1127" class="node-sub">Compare invoice.js recomputation with the stored totals from pricing.js and the GST rate and split logic in tax.js.</text>

  <rect x="40" y="1174" width="1800" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="62" y="1210" class="section">LATER · PRINTABLE HTML INVOICE</text>

  <rect x="75" y="1250" width="330" height="130" rx="10" class="route"/>
  <text x="98" y="1284" class="node-title">server.js route</text>
  <text x="98" y="1312" class="node-sub">GET /orders/:id/invoice</text>
  <text x="98" y="1338" class="node-sub">Reads order via store.read + orders.get</text>

  <path d="M405 1315 H470" class="invoice-flow"/>
  <circle cx="438" cy="1289" r="14" class="badge-invoice"/><text x="438" y="1289" class="badge-text">8</text>

  <rect x="486" y="1250" width="300" height="130" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="509" y="1284" class="node-title">orders.js · get</text>
  <text x="509" y="1312" class="node-sub">Fetches the saved order</text>
  <text x="509" y="1338" class="node-sub">from db.orders</text>

  <path d="M786 1315 H851" class="invoice-flow"/>
  <rect x="867" y="1250" width="390" height="130" rx="12" class="focus-strong"/>
  <text x="891" y="1284" class="node-title">invoice.js · render</text>
  <text x="891" y="1312" class="node-sub">computeInvoiceFigures(order)</text>
  <text x="891" y="1338" class="node-sub">Recomputes subtotal, GST, discount and total</text>
  <path d="M1257 1315 H1322" class="reference"/>

  <rect x="1338" y="1250" width="215" height="130" rx="12" class="focus"/>
  <text x="1360" y="1284" class="node-title">pricing.js</text>
  <text x="1360" y="1312" class="node-sub">Stored order totals</text>
  <text x="1360" y="1338" class="node-sub">Discount in pricing flow</text>
  <path d="M1553 1315 H1618" class="reference"/>

  <rect x="1634" y="1250" width="180" height="130" rx="12" class="focus"/>
  <text x="1655" y="1284" class="node-title">tax.js</text>
  <text x="1655" y="1312" class="node-sub">HSN rate lookup</text>
  <text x="1655" y="1338" class="node-sub">GST split helper</text>

  <text x="62" y="1410" class="small">Invoice calculations currently rebuild tax from item lines and coupon config; pricing applies apportioned discounts before GST.</text>
  <text x="62" y="1451" class="small">Gray arrows show module wiring. Numbered blue and purple arrows are explained by the step cards above.</text>
</svg>
